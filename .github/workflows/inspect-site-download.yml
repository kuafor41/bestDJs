name: Inspect TopDJMixes Download flow
on:
  push:
    paths:
      - 'tools/site_download_diagnostic.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bestdjs-site-download-inspection
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser
        run: python -m pip install requests beautifulsoup4
      - name: Inspect the site's own Download flow without login attempts
        run: python tools/site_download_diagnostic.py
