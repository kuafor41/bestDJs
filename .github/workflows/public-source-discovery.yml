name: Public source discovery (no login)
on:
  push:
    paths:
      - 'tools/public_source_probe.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bestdjs-public-discovery
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Inspect public publishing paths only
        run: python tools/public_source_probe.py
