name: Update bestDJs RSS

on:
  workflow_dispatch:
    inputs:
      rebuild_all:
        description: "Re-scan the catalogue while preserving all historical RSS episodes and reports"
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "build_feed.py"
      - "public/bestdjs-cover.jpg"
      - "tests/test_feed.py"
      - ".github/workflows/update-feed.yml"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: bestdjs-rss-update
  cancel-in-progress: false

jobs:
  update-feed:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade requests beautifulsoup4 playwright
          python -m playwright install --with-deps chromium

      - name: Verify podcast artwork asset
        run: test -s public/bestdjs-cover.jpg

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Validate required secrets
        env:
          SOURCE_USERNAME: ${{ secrets.SOURCE_USERNAME }}
          SOURCE_PASSWORD: ${{ secrets.SOURCE_PASSWORD }}
        run: |
          test -n "$SOURCE_USERNAME" || { echo "::error::Missing SOURCE_USERNAME secret"; exit 1; }
          test -n "$SOURCE_PASSWORD" || { echo "::error::Missing SOURCE_PASSWORD secret"; exit 1; }
          echo "Required secrets are configured (values are not displayed)."

      - name: Build complete incremental mixshow archive
        env:
          SOURCE_USERNAME: ${{ secrets.SOURCE_USERNAME }}
          SOURCE_PASSWORD: ${{ secrets.SOURCE_PASSWORD }}
          REBUILD_ALL: ${{ github.event.inputs.rebuild_all == 'true' }}
          MAX_REST_PAGES: "600"
          MAX_DISCOVERED_SHOWS: "300"
          REQUEST_DELAY_SECONDS: "0.5"
          REST_REQUEST_DELAY_SECONDS: "0.1"
          RETRY_MAX_AGE_DAYS: "45"
        run: python build_feed.py

      - name: Verify generated production RSS
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from urllib.parse import urlparse, parse_qsl
          root = ET.parse("public/rss.xml").getroot()
          items = root.findall("./channel/item")
          assert items, "Production RSS contains no episodes"
          guids = [item.findtext("guid") for item in items]
          assert len(guids) == len(set(guids)), "Duplicate episode GUIDs found"
          for item in items:
              title = item.findtext("title") or ""
              assert title and item.findtext("description") and item.findtext("pubDate"), "Incomplete RSS item"
              enclosure = item.find("enclosure")
              assert enclosure is not None and enclosure.get("type") == "audio/mpeg", "Missing audio/mpeg enclosure"
              parsed = urlparse(enclosure.get("url", ""))
              assert parsed.path.lower().endswith(".mp3"), f"Enclosure is not a direct MP3 URL: {title}"
              keys = {key.lower().replace("-", "_") for key, _ in parse_qsl(parsed.query, keep_blank_values=True)}
              expiring = {"expires", "expiry", "exp", "token", "signature", "sig", "policy", "key_pair_id",
                          "x_amz_", "x_goog_", "hdnts", "auth", "st", "et", "e"}
              assert not any(key in expiring or key.startswith(("x_amz_", "x_goog_")) for key in keys), f"Potentially temporary enclosure URL: {title}"
          print(f"Production RSS validation passed: {len(items)} episodes")
          PY

      - name: Commit RSS and tracking reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/rss.xml public/bestdjs-cover.jpg data/retry-queue.csv data/update-report.csv data/show-inventory.csv data/success-report.csv
          if [ -f data/episode-artwork-index.csv ]; then git add data/episode-artwork-index.csv; fi
          if [ -d public/episode-artwork ]; then git add public/episode-artwork/; fi
          if git diff --cached --quiet; then
            echo "RSS and tracking files unchanged; no commit needed."
          else
            git commit -m "Update bestDJs incremental archive and reports"
            git push
          fi
